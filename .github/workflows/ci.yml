name: CI
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: npm ci
      - name: Conferir dados de exemplo
        run: npm run dados-exemplo:conferir
      - name: Conferir papéis
        run: npm run papeis:conferir
      - run: npm run build
        env:
          VITE_BASE44_APP_ID: ${{ vars.BASE44_APP_ID }}
