name: Deploy Base44
on:
  push:
    branches: [main]
  workflow_dispatch:
concurrency:
  group: deploy-production
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm install -g base44@0.3.3
      - name: Deploy (entidades, funções e site)
        env:
          BASE44_APP_ID: ${{ vars.BASE44_APP_ID }}
          VITE_BASE44_APP_ID: ${{ vars.BASE44_APP_ID }}
          BASE44_ACCESS_TOKEN: ${{ secrets.BASE44_ACCESS_TOKEN }}
          BASE44_REFRESH_TOKEN: ${{ secrets.BASE44_REFRESH_TOKEN }}
        run: base44 deploy -y --build
