name: Deploy Base44
on:
  push:
    branches: [main]
  workflow_dispatch:
concurrency:
  group: deploy-production
  cancel-in-progress: false
# O environment production não tem aprovação (em repo privado ela exige GitHub Enterprise); ele
# existe para guardar as secrets do deploy e só aceitar a branch main. Assim uma branch qualquer
# não consegue ler as credenciais. A barreira de aprovação é o PR (CODEOWNERS) antes do merge.
permissions:
  contents: read
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: npm ci
      - run: npm install -g base44@0.3.3
      # A main do app no Base44 fica protegida o tempo todo, e assim nem o owner muda a produção
      # por fora do git. A proteção também barra o deploy do CLI, então ela é desligada só
      # durante o deploy e religada no passo final, que roda mesmo se o deploy falhar.
      - name: Desligar a proteção da main no Base44
        env:
          BASE44_APP_ID: ${{ vars.BASE44_APP_ID }}
          BASE44_ACCESS_TOKEN: ${{ secrets.BASE44_ACCESS_TOKEN }}
          BASE44_REFRESH_TOKEN: ${{ secrets.BASE44_REFRESH_TOKEN }}
          BASE44_DISABLE_TELEMETRY: "1"
        run: |
          set -euo pipefail
          base44 whoami > /dev/null 2>&1
          TOKEN=$(node -e 'console.log(require(require("os").homedir()+"/.base44/auth/auth.json").accessToken)')
          echo "::add-mask::$TOKEN"
          status=$(curl -sS -o resposta.json -w '%{http_code}' -X PUT \
            -H "Authorization: Bearer $TOKEN" -H "Content-Type: application/json" \
            -d '{"protected": false}' \
            "https://app.base44.com/api/apps/$BASE44_APP_ID/branches/main/protection")
          if [ "$status" != "200" ]; then echo "::error::falha ao desligar a proteção (HTTP $status)"; exit 1; fi
          echo "::notice::proteção da main desligada para o deploy"
      - name: Deploy (entidades, funções e site)
        env:
          BASE44_APP_ID: ${{ vars.BASE44_APP_ID }}
          VITE_BASE44_APP_ID: ${{ vars.BASE44_APP_ID }}
          BASE44_ACCESS_TOKEN: ${{ secrets.BASE44_ACCESS_TOKEN }}
          BASE44_REFRESH_TOKEN: ${{ secrets.BASE44_REFRESH_TOKEN }}
          BASE44_DISABLE_TELEMETRY: "1"
        run: |
          set -o pipefail
          base44 deploy -y --build > deploy.log 2>&1 || { tail -n 25 deploy.log | sed -E 's/[A-Za-z0-9_-]{30,}/[omitido]/g; s/%/%25/g; s/^/::error::deploy: /'; exit 1; }
          tail -n 15 deploy.log | sed -E 's/[A-Za-z0-9_-]{30,}/[omitido]/g; s/^/::notice::deploy: /'
      - name: Aplicar os papéis do repo (base44/papeis.json)
        env:
          BASE44_APP_ID: ${{ vars.BASE44_APP_ID }}
          BASE44_ACCESS_TOKEN: ${{ secrets.BASE44_ACCESS_TOKEN }}
          BASE44_REFRESH_TOKEN: ${{ secrets.BASE44_REFRESH_TOKEN }}
          BASE44_DISABLE_TELEMETRY: "1"
        run: |
          set -euo pipefail
          base44 whoami > /dev/null 2>&1
          TOKEN=$(node -e 'console.log(require(require("os").homedir()+"/.base44/auth/auth.json").accessToken)')
          echo "::add-mask::$TOKEN"
          BASE44_TOKEN="$TOKEN" node scripts/papeis/aplicar.mjs
      - name: Religar a proteção da main no Base44
        if: always()
        env:
          BASE44_APP_ID: ${{ vars.BASE44_APP_ID }}
          BASE44_ACCESS_TOKEN: ${{ secrets.BASE44_ACCESS_TOKEN }}
          BASE44_REFRESH_TOKEN: ${{ secrets.BASE44_REFRESH_TOKEN }}
          BASE44_DISABLE_TELEMETRY: "1"
        run: |
          set -euo pipefail
          base44 whoami > /dev/null 2>&1
          TOKEN=$(node -e 'console.log(require(require("os").homedir()+"/.base44/auth/auth.json").accessToken)')
          echo "::add-mask::$TOKEN"
          status=$(curl -sS -o resposta.json -w '%{http_code}' -X PUT \
            -H "Authorization: Bearer $TOKEN" -H "Content-Type: application/json" \
            -d '{"protected": true}' \
            "https://app.base44.com/api/apps/$BASE44_APP_ID/branches/main/protection")
          if [ "$status" != "200" ] || ! grep -q '"protected": *true' resposta.json; then
            echo "::error::falha ao religar a proteção (HTTP $status). Religue manualmente."; exit 1
          fi
          echo "::notice::proteção da main religada"
